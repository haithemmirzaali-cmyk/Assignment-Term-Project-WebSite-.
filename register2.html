<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มหาวิทยาลัย - สมัครเรียนออนไลน์</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
       <div class="brand">
            <img src="image/logo.png" alt="โลโก้" class="logo">
            <h1 class="header-title">มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ</h1>
            <div style="margin-left: auto; text-align: right;">
                <img src="image/user.jpg"">
                <div style="color: white; font-size: 14px; margin-bottom: 2px;">ผู้ใช้งาน: Haithem Mirza</div>
                <h4><a href="login.html" style="color: white;text-decoration: none;font-size: 15px;">ออกจากระบบ</a></h4>
            </div>
        </div>
    </header>

    <nav class="menubar">
        <a href="index_login.html">หน้าหลัก</a>
        <a href="admission_login.html">กำหนดการรับสมัคร</a>
        <a href="register.html">สมัครเรียน</a>
    </nav>

    <div class="container">
        <h1>แบบฟอร์มสมัครเรียน</h1>
        <form action="confirmation.html" method="get">
            <div class="form-group">
                <label>First name:</label>
                <input type="text" required><br>
                <label>Last name:</label>
                <input type="text" required><br>
                <label>Email:</label>
                <input type="email" name="email" required><br>
                <label>Address:</label>
                <input type="text" name="address" required><br>
                <label>Code ID:</label>
                <input type="number" name="code_id" pattern="[0-9]{13}" required><br>
                <label>Phone Number:</label>
                <input type="tel" pattern="[0-9]{3}[0-9]{3}[0-9]{4}" required><br>

                <label>Date of birth:</label>
                <input type="date" required><br>
                <label>Weight(kg):</label>
                <input type="number" min="0" max="300"><br>
                <label>Height(cm):</label>
                <input type="number" min="0" max="300"><br>

                <label>Student Photo(1.5 - 2 inch ):</label>
                <input type="file" required><br>
                <label>Transcript:</label>
                <input type="file" required><br>
            </div>

            <div class="form-group">
                <label for="faculty">สาขา/คณะที่ต้องการสมัคร</label>
                <select id="faculty" name="faculty" required>
                    <option value="">-- กรุณาเลือกสาขา --</option>
                    <option value="it">IT</option>
                    <option value="iti">ITI</option>
                    <option value="itt">ITT</option>
                    <option value="ine">INE</option>
                    <option value="inet">INET</option>
                </select>
            </div>
                <button type="submit">ส่งใบสมัคร</button>
        </form>
    </div>

    <footer>
        <p> © 2027 King Mongkut's University of Technology</p>
    </footer>

</body>

</html>
